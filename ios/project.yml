# The Xcode project, described as text. XcodeGen turns this into
# TeaNode.xcodeproj, which is not committed: run `xcodegen generate` in this
# directory after changing it. See README.md.

name: TeaNode

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig

packages:
  TeaNodeKit:
    path: TeaNodeKit

targets:
  TeaNode:
    type: application
    platform: iOS
    sources:
      - TeaNode/Sources
      - TeaNode/Resources
      - TeaNode/ObjectiveC
      - Shared
    dependencies:
      - package: TeaNodeKit
      - target: TeaNodeNotification
      - target: TeaNodeShare
      - target: TeaNodeWidgets
      - target: TeaNodeAutoFill
      - sdk: HealthKit.framework
    # teanode.com/app/connect links open the app (the site serves the
    # association file), so scanning a connect code with the Camera does.
    # Notifications, and a keychain group the notification extension
    # shares, so it can read the key notifications are encrypted with.
    # A call goes on with the screen locked: audio, and CallKit's voip.
    # The photo backup catches up overnight on power (a processing task), and
    # goes on when the person taps Back up now (a continued processing task);
    # the system only starts a task whose identifier is listed here. The Health
    # history goes on the same way, on power, when the phone is unlocked.
    info:
      path: TeaNode/Info.plist
      properties:
        UIBackgroundModes: [audio, voip, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - $(TEANODE_BUNDLE_IDENTIFIER).photo-backup
          - $(TEANODE_BUNDLE_IDENTIFIER).photo-backup-now
          - $(TEANODE_BUNDLE_IDENTIFIER).health-history
        NSSupportsLiveActivities: true
        TeaNodeAppGroup: $(TEANODE_APP_GROUP)
        # The keychain group the Passwords account key is kept in (PasswordsKeychainKeyStore).
        TeaNodePasswordsKeychainGroup: $(AppIdentifierPrefix)$(TEANODE_PASSWORDS_KEYCHAIN_GROUP)
    entitlements:
      path: TeaNode/TeaNode.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TEANODE_APP_GROUP)
        com.apple.developer.associated-domains:
          - applinks:teanode.com
        aps-environment: development
        # The shared group comes first, which is where an item goes when no group is named
        # (the sign-in). The Passwords group is the app's and the AutoFill extension's alone.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
          - $(AppIdentifierPrefix)$(TEANODE_PASSWORDS_KEYCHAIN_GROUP)
        # TeaNode as a provider in Settings, General, AutoFill & Passwords
        # (the TeaNodeAutoFill extension): the app carries the capability too.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        # Apple Health, read only: the app never writes to it. The access list
        # stays empty (it is for clinical records, which are not read), and
        # background delivery lets iOS wake the app about new data.
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: TeaNode
        SWIFT_VERSION: "6.0"
        # Shared/ is built into the widgets too; what only the app has is
        # behind this.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TEANODE_APP
        SWIFT_OBJC_BRIDGING_HEADER: TeaNode/ObjectiveC/TeaNode-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TeaNode
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The iPad turns every way: iPadOS offers an app Split View and Slide Over
        # only when it supports all four orientations. The iPhone stays upright.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The TeaNode leaf on white, from docs/images/logo.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TeaNode green, the one color of the app's own (DESIGN.md).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "TeaNode uses the camera to scan the code that connects it to your server, and to take pictures you send."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "TeaNode asks for Face ID to open Passwords, and before you approve a payment somebody made with a skill you share."
        INFOPLIST_KEY_NSContactsUsageDescription: "TeaNode reads your iPhone's contacts only when you choose to import them into your address book."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "TeaNode saves the photos you choose to your library."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "TeaNode backs up your photos and videos to your server when you turn on backup."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TeaNode uses the microphone while you call your agent or explicitly record a meeting."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "TeaNode shows where you are on the map and follows you while the app is open, and your agent asks where you are when something you asked depends on it."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "TeaNode copies the Health data you allow to your own TeaNode server. Your agent reads it only if you turn that on in Health settings."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "TeaNode only reads Apple Health and never writes to it."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "TeaNode records the places you go, so you can look back on them, share where you are with your family, and so your agent knows your routine."
        # The app encrypts nothing beyond the https the system provides, which
        # export rules exempt; saying so here spares every upload the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"

  # Decrypts each notification before iOS shows it, and gives it its
  # buttons. Neither Apple nor the relay can read what a notification says.
  TeaNodeNotification:
    type: app-extension
    platform: iOS
    sources:
      - TeaNodeNotification
      # The buttons a notification has, and their words, shared with the app.
      - TeaNode/Sources/NotificationCategories.swift
      - TeaNode/Resources/Localizable.xcstrings
    dependencies:
      - package: TeaNodeKit
    entitlements:
      path: TeaNodeNotification/TeaNodeNotification.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
    info:
      path: TeaNodeNotification/Info.plist
      properties:
        CFBundleDisplayName: TeaNode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER).notification
        # The Swift 5 language mode: see NotificationService.swift.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  # TeaNode in the share sheet: pictures, files, a link or words from any
  # app, sent to the person's agent with a note. It reads the sign-in from
  # the keychain group the app shares.
  TeaNodeShare:
    type: app-extension
    platform: iOS
    sources:
      - TeaNodeShare
      - TeaNode/Resources/Localizable.xcstrings
      - TeaNode/Sources/StatementImportWords.swift
    dependencies:
      - package: TeaNodeKit
    entitlements:
      path: TeaNodeShare/TeaNodeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TEANODE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
    info:
      path: TeaNodeShare/Info.plist
      properties:
        TeaNodeAppGroup: $(TEANODE_APP_GROUP)
        CFBundleDisplayName: TeaNode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsFileWithMaxCount: 8
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER).share
        # The Swift 5 language mode: see ShareViewController.swift.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  # The widgets, the Lock Screen's and Control Center's: asking or calling
  # the agent, and what is next. They read the sign-in from the keychain
  # group the app shares.
  TeaNodeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TeaNodeWidgets
      - Shared
      - path: TeaNode/Resources/Assets.xcassets
      - TeaNode/Resources/Localizable.xcstrings
    dependencies:
      - package: TeaNodeKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: TeaNodeWidgets/TeaNodeWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
    info:
      path: TeaNodeWidgets/Info.plist
      properties:
        CFBundleDisplayName: TeaNode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER).widgets
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  # TeaNode as an AutoFill provider: Safari, Chrome and other apps offer the
  # person's logins, passkeys and one-time codes from Passwords. It reads the
  # copy of Passwords the app keeps in the app group and the account key
  # behind Face ID in the keychain group of its own that only it and the app
  # have, and uses the network only to save a passkey it has just made. The
  # sign-in comes from the same keychain group as the share extension's. The
  # extension is killed at about 120 MB.
  TeaNodeAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - TeaNodeAutoFill
      - path: TeaNode/Resources/Assets.xcassets
      - TeaNode/Resources/Localizable.xcstrings
      # The Face ID purpose string, translated.
      - TeaNode/Resources/InfoPlist.xcstrings
    dependencies:
      - package: TeaNodeKit
    entitlements:
      path: TeaNodeAutoFill/TeaNodeAutoFill.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - $(TEANODE_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
          - $(AppIdentifierPrefix)$(TEANODE_PASSWORDS_KEYCHAIN_GROUP)
    info:
      path: TeaNodeAutoFill/Info.plist
      properties:
        TeaNodeAppGroup: $(TEANODE_APP_GROUP)
        TeaNodePasswordsKeychainGroup: $(AppIdentifierPrefix)$(TEANODE_PASSWORDS_KEYCHAIN_GROUP)
        CFBundleDisplayName: TeaNode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The extension is its own process, so it needs its own Face ID text.
        NSFaceIDUsageDescription: "TeaNode asks for Face ID to open Passwords, and before you approve a payment somebody made with a skill you share."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ProvidesOneTimeCodes: true
              ShowsConfigurationUI: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER).autofill
        # The Swift 5 language mode: see CredentialProviderViewController.swift.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

schemes:
  TeaNode:
    build:
      targets:
        TeaNode: all
