# The Xcode project, described as text. XcodeGen turns this into
# TeaNode.xcodeproj, which is not committed: run `xcodegen generate` in this
# directory after changing it. See README.md.

name: TeaNode

options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig

packages:
  TeaNodeKit:
    path: TeaNodeKit

targets:
  TeaNode:
    type: application
    platform: iOS
    sources:
      - TeaNode/Sources
      - TeaNode/Resources
    dependencies:
      - package: TeaNodeKit
      - target: TeaNodeNotification
    # teanode.com/app/connect links open the app (the site serves the
    # association file), so scanning a connect code with the Camera does.
    # Notifications, and a keychain group the notification extension
    # shares, so it can read the key notifications are encrypted with.
    # A call goes on with the screen locked: audio, and CallKit's voip.
    info:
      path: TeaNode/Info.plist
      properties:
        UIBackgroundModes: [audio, voip]
    entitlements:
      path: TeaNode/TeaNode.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:teanode.com
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: TeaNode
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TeaNode
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The TeaNode leaf on white, from docs/images/logo.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # TeaNode green, the one color of the app's own (DESIGN.md).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "TeaNode uses the camera to scan the code that connects it to your server."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "TeaNode uses the microphone while you call your agent."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your agent asks where you are when something you asked depends on it, such as the weather or how long a trip takes."
        # The app encrypts nothing beyond the https the system provides, which
        # export rules exempt; saying so here spares every upload the question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"

  # Decrypts each notification before iOS shows it, and gives it its
  # buttons. Neither Apple nor the relay can read what a notification says.
  TeaNodeNotification:
    type: app-extension
    platform: iOS
    sources:
      - TeaNodeNotification
      # The buttons a notification has, and their words, shared with the app.
      - TeaNode/Sources/NotificationCategories.swift
      - TeaNode/Resources/Localizable.xcstrings
    dependencies:
      - package: TeaNodeKit
    entitlements:
      path: TeaNodeNotification/TeaNodeNotification.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(TEANODE_KEYCHAIN_GROUP)
    info:
      path: TeaNodeNotification/Info.plist
      properties:
        CFBundleDisplayName: TeaNode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TEANODE_BUNDLE_IDENTIFIER).notification
        # The Swift 5 language mode: see NotificationService.swift.
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  TeaNode:
    build:
      targets:
        TeaNode: all
