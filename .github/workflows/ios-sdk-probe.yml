name: iOS SDK probe

# Prints what the iOS SDK says about Live Activity backgrounds. Temporary.
on:
  push:
    branches: ["ios/recording-live"]
    paths: [".github/workflows/ios-sdk-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Look in the SDK
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          interface="$sdk/System/Library/Frameworks/WidgetKit.framework/Modules/WidgetKit.swiftmodule/arm64e-apple-ios.swiftinterface"
          grep -n -i -B6 -A12 "WidgetTexture" "$interface" | head -150
          grep -n -i "widgetTexture\|ActivityTexture\|texture" "$interface" | head -40
          activity="$sdk/System/Library/Frameworks/ActivityKit.framework/Modules/ActivityKit.swiftmodule/arm64e-apple-ios.swiftinterface"
          grep -n -i "texture\|background\|glass" "$activity" | head -20
