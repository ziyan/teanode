name: Secrets

# gitleaks, for the half of secret scanning GitHub does not give a public
# repository on this plan. GitHub scans for tokens whose issuer registered a
# pattern with them, and push protection stops those before they land. The
# generic shapes — a private key, a connection string, an authorization header
# — are behind Secret Protection, which costs money. This is that half.
#
# It reads history rather than the working tree, because a secret removed in a
# later commit is still published, and a scanner that only sees the tip would
# call that repository clean. That is also why this is not a step in the CI
# jobs: they check out one commit, and are right to.
#
# scripts/check-secrets.bash is the third scanner and is not replaced by this
# one. It knows things about this project that no general tool can: which
# hostnames are ours and which belong to an operator who should never appear
# here.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday morning, off the hour and after the vulnerability scan, so the two
    # security jobs do not report at once and do not queue behind everything
    # else scheduled on the hour.
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Leaked secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # SARIF makes a finding an alert on the Security tab, which can be
      # dismissed with a recorded reason. Without it a false positive is a red
      # cross that somebody eventually learns to rerun past.
      security-events: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, which is the whole point

      - uses: actions/setup-go@v7
        with:
          # From go.mod, so the version CI builds with is the version the
          # module declares: they drifted, go.mod went to 1.26 with a
          # dependency, and the pin here stayed at 1.25.
          go-version-file: go.mod
          cache: false # dependencies are vendored

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      # --redact keeps the secret itself out of the report. The report becomes
      # a public code scanning alert, and republishing a leaked key in the
      # notice about the leak would be its own incident.
      - name: Scan
        run: gitleaks git --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif --redact

      - name: Report
        # always(), so a run that found something still files it: the step
        # above exits non-zero on a finding, and that finding is the one worth
        # uploading. Skipped for a pull request from a fork, whose token
        # cannot write security events, so the upload would fail on exactly
        # the changes least trusted. Those runs still fail the step above,
        # which is what blocks the merge.
        if: always() && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
