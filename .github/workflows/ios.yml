          shoot photos-backup-off-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-off
          shoot photos-backup-on-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-on
          shoot photos-backup-on-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-on
          shoot photos-backup-on-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-on
          # Files waiting for the network, with the library's size and limits at the bottom of the screen.
          shoot photos-backup-waiting-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-waiting
          shoot photos-backup-waiting-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-waiting
          shoot photos-backup-waiting-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-waiting
          # Uploads that continue in the background, and files that wait for the app or the night.
          shoot photos-backup-background-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-background
          shoot photos-backup-background-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-background
          shoot photos-backup-background-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-background
          # Backup on for another account: the row in Settings, and the screen it opens.
          shoot settings-photo-backup-other-account-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings-photo-backup-other-account
          shoot photos-backup-other-account-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-other-account
          shoot photos-backup-other-account-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-backup-other-account
          # Settings, and the screens it pushes, named by -TeaNodeScreen.
          shoot settings-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings
          shoot settings-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings
          # A confirmation points at the button that asked for it.
          shoot settings-sign-out-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings-sign-out
          shoot settings-sign-out-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings-sign-out
          for setup_screen in device-setup device-setup-mail device-setup-collections device-setup-profile device-setup-unavailable device-setup-expired device-setup-receipt-unavailable; do
            shoot "$setup_screen-light" light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
            shoot "$setup_screen-dark" dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
            shoot "$setup_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
          done
          shoot agent-settings-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-settings
          shoot manage-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen manage
          shoot people-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen people
          shoot domain-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen domain
          shoot domain-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen domain
          shoot dns-records-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dns-records
          # The provider editor, scrolled to the price of a particular model.
          shoot provider-prices-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          shoot provider-prices-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          shoot provider-prices-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          # The same editor for a provider with a billing key, scrolled to the prices from the bill.
          shoot provider-billing-check-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-billing-check
          shoot provider-billing-check-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-billing-check
          shoot provider-billing-check-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-billing-check
          shoot dns-records-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dns-records
          shoot server-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen server
          shoot sessions-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen sessions
          shoot devices-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen devices
          shoot devices-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen devices
          shoot phones-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen phones
          # The server's usage by day, with the provider's bill beside the estimate.
          shoot agent-usage-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-usage
          shoot agent-usage-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-usage
          shoot agent-usage-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-usage
          shoot agent-usage-cost-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-usage-cost
          shoot agent-usage-cost-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-usage-cost
          shoot rules-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen rules
          shoot dreams-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dreams
          shoot schedules-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen schedules
          shoot activity-run-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen activity-run
          shoot activity-run-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen activity-run
          # The alert settings, with what the agent is following.
          shoot alerts-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen alerts
          shoot alerts-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen alerts
          shoot alerts-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen alerts
          # The same screen scrolled to what the agent is following.
          shoot alerts-following-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen alerts-following
          shoot alerts-following-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen alerts-following

          # The circles feature (docs/planning/circles-and-chats-execplan.md),
          # each screen in light, dark and the largest text. Circles, a
          # circle's page as its admin, the picture on the profile, and the
          # sheet and the card of a shared skill: Settings pushes them.
          for circles_screen in circles circle-detail circle-join-offer settings-picture skill-share-sheet skill-share-call; do
            shoot "$circles_screen-light" light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$circles_screen"
            shoot "$circles_screen-dark" dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$circles_screen"
            shoot "$circles_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$circles_screen"
          done
          # The conversation list with two chats among the agent's, and the
          # chats: a direct one, a circle's, and its members sheet.
          shoot conversations-light light large -TeaNodeDemo -TeaNodeMenu -TeaNodeScreen conversations
          shoot conversations-dark dark large -TeaNodeDemo -TeaNodeMenu -TeaNodeScreen conversations
          shoot conversations-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeMenu -TeaNodeScreen conversations
          for chat_screen in chat-direct chat-group chat-members; do
            shoot "$chat_screen-light" light large -TeaNodeDemo -TeaNodeScreen "$chat_screen"
            shoot "$chat_screen-dark" dark large -TeaNodeDemo -TeaNodeScreen "$chat_screen"
            shoot "$chat_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeScreen "$chat_screen"
          done
          # Calendars other people shared, the screen that shares the person's own, and the one that finds a time they are all free.
          for calendar_screen in calendar-shared calendar-share-sheet calendar-find-time; do
            shoot "$calendar_screen-light" light large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen "$calendar_screen"
            shoot "$calendar_screen-dark" dark large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen "$calendar_screen"
            shoot "$calendar_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen "$calendar_screen"
          done
          # Pages other people shared: the list by owner, and one page read only.
          for knowledge_screen in knowledge-shared knowledge-shared-page; do
            shoot "$knowledge_screen-light" light large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen "$knowledge_screen"
            shoot "$knowledge_screen-dark" dark large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen "$knowledge_screen"
            shoot "$knowledge_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen "$knowledge_screen"
          done

          # The App Store's set: the largest iPhone, which its listing needs,
          # with the status bar Apple's own screenshots show. The fourth
          # machine's, every screen of it.
          if [ "$SHARD" != 3 ]; then
            exit 0
          fi
          SHARD_COUNT=1 SHARD=0
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --operatorName ""
          mkdir -p screenshots/store
          shoot store/1-conversation light large -TeaNodeDemo
          shoot store/2-mail light large -TeaNodeDemo -TeaNodeTab mail
          shoot store/3-calendar light large -TeaNodeDemo -TeaNodeTab calendar
          shoot store/4-goals light large -TeaNodeDemo -TeaNodeTab goals
          shoot store/5-menu dark large -TeaNodeDemo -TeaNodeMenu
          shoot store/6-conversation-dark dark large -TeaNodeDemo

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.shard }}
          path: ios/screenshots

  # Signs the app and uploads it to App Store Connect, where it appears in
  # TestFlight once Apple has processed it (usually 10 to 30 minutes).
  # Signing is automatic: the development certificate kept in the secrets
  # signs the archive, and the App Store Connect key, with the Admin role,
  # lets Xcode fetch the profiles and the distribution certificate it
  # needs. Only a push to main or to an ios/... branch uploads, never a
  # pull request.
  testflight:
    name: TestFlight
    if: github.event_name != 'pull_request'
    needs: [kit, app]
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The project is generated, with what Homebrew installs, before the
      # App Store Connect key is on disk: nothing installed reads it.
      - name: Generate the project
        working-directory: ios
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM" > Configuration/Identity.xcconfig
          brew install xcodegen
          xcodegen generate

      - name: Put the App Store Connect key where Xcode reads it
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      # Archiving signs with a development certificate. One is kept in the
      # secrets and put in a keychain of the run's own; without it Xcode
      # would make a new certificate every run, and Apple allows only a few.
      - name: Put the signing certificate in a keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/keys/development.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/keys/development.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/keys/development.p12"

      # The build number is the workflow's run number, which only grows, as
      # App Store Connect requires of builds of one version.
      - name: Archive
        working-directory: ios
        run: >
          xcodebuild archive
          -project TeaNode.xcodeproj
          -scheme TeaNode
          -destination 'generic/platform=iOS'
          -archivePath build/TeaNode.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          -quiet

      - name: Sign and upload to App Store Connect
        working-directory: ios
        run: >
          xcodebuild -exportArchive
          -archivePath build/TeaNode.xcarchive
          -exportOptionsPlist Configuration/ExportOptions.plist
          -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" ios/Configuration/Identity.xcconfig
