name: iOS

# The iPhone app (ios/). Nobody working on it needs a Mac: the package's
# tests run on Linux, and the app is built on GitHub's macOS runners, which
# are free for a public repository.
on:
  # Every pull request, so the checks are there to be required; one that
  # does not touch the app skips the build at once (see changes). By hand,
  # on any branch, for a build that also goes to TestFlight.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether a pull request touches the app. A required check that never
  # reports holds a pull request forever, so the workflow runs on every one
  # and the builds are skipped, which counts as passing, when nothing in
  # ios/ changed.
  changes:
    name: App changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(ios/|\.github/workflows/ios\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  kit:
    name: TeaNodeKit on Linux
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test
        working-directory: ios/TeaNodeKit
        run: swift test

  app:
    name: App on macOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Say which Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Test TeaNodeKit
        working-directory: ios/TeaNodeKit
        run: swift test

      - name: Generate the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # A simulator build needs no signing, so it needs none of the
      # developer account's secrets either.
      - name: Build for the simulator
        working-directory: ios
        run: >
          xcodebuild build
          -project TeaNode.xcodeproj
          -scheme TeaNode
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          -quiet

  # The screens, in a job of their own beside the build, so that TestFlight
  # waits only for the build and the tests. The screenshot checks compile
  # while the app builds; the simulators boot after it, since a booting
  # simulator's first-run setup took the CPU and made the build four times
  # slower (23 minutes against 5).
  #
  # They are split across four machines, since a hundred and sixty screens
  # one after another took most of an hour: three take every third screen
  # of the list, and the fourth takes the App Store's set, which needs a
  # simulator of its own to boot.
  screenshots:
    name: Screenshots (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pick the simulators and compile the checks
        working-directory: ios
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime in sorted(runtimes) if "iOS" in runtime for device in runtimes[runtime]
                    if device["name"].startswith("iPhone") and device["name"].endswith(sys.argv[1])]
          print(phones[-1]["udid"])' "$1"
          }
          phone=$(pick " Pro")
          largest=$(pick " Pro Max")
          echo "PHONE=$phone" >> "$GITHUB_ENV"
          echo "LARGEST_PHONE=$largest" >> "$GITHUB_ENV"
          mkdir -p build
          for check in recording device-setup knowledge conversation; do
            swiftc "scripts/assert-$check-screenshot.swift" -o "build/assert-$check-screenshot" &
          done
          wait

      - name: Generate the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: >
          xcodebuild build
          -project TeaNode.xcodeproj
          -scheme TeaNode
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          -quiet

      # What the screens look like, for the review ios/DESIGN.md asks for:
      # the connect screen, and a conversation of invented data from the
      # debug build's demo server, in light, dark and the largest text size.
      - name: Take screenshots
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphonesimulator/TeaNode.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          # The machine for the App Store's set boots only the largest phone,
          # and takes none of the screens of the list (its shard matches no
          # third of it).
          device=$PHONE
          if [ "$SHARD" = 3 ]; then
            device=$LARGEST_PHONE
          fi
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          mkdir -p screenshots
          # A screen is taken once it has stopped changing: two looks a
          # second apart that are the same, after six seconds at least and
          # twelve at most. Not sooner: the launch screen is blank and holds
          # still, and two seconds took it for the app's.
          settle() {
            target=$1
            previous="$RUNNER_TEMP/settle-previous.png"
            sleep 5
            xcrun simctl io "$device" screenshot "$previous" >/dev/null 2>&1
            for look in {1..7}; do
              sleep 1
              xcrun simctl io "$device" screenshot "$target" >/dev/null 2>&1
              if cmp -s "$previous" "$target"; then
                return
              fi
              cp "$target" "$previous"
            done
          }
          # The appearance and the text size are set only when they change:
          # each change redraws the whole simulator.
          shown_appearance="" shown_size=""
          shot_index=0
          shoot() {
            name=$1 appearance=$2 size=$3
            shift 3
            # Every third screen is this machine's.
            shot_index=$((shot_index + 1))
            if [ $(((shot_index - 1) % SHARD_COUNT)) != "$SHARD" ]; then
              return 0
            fi
            if [ "$appearance" != "$shown_appearance" ]; then
              xcrun simctl ui "$device" appearance "$appearance"
              shown_appearance=$appearance
            fi
            if [ "$size" != "$shown_size" ]; then
              xcrun simctl ui "$device" content_size "$size"
              shown_size=$size
            fi
            xcrun simctl terminate "$device" "$bundle" 2>/dev/null || true
            xcrun simctl launch "$device" "$bundle" "$@"
            settle "screenshots/$name.png"
            case "$name" in
              recordings-*|recording-*|device-setup-*|knowledge-records-*|conversation-long-message-*)
                # The screen may still be loading its demo answers: look
                # again a few times before calling it wrong.
                case "$name" in
                  device-setup-*) assertion=build/assert-device-setup-screenshot ;;
                  knowledge-records-*) assertion=build/assert-knowledge-screenshot ;;
                  conversation-long-message-*) assertion=build/assert-conversation-screenshot ;;
                  *) assertion=build/assert-recording-screenshot ;;
                esac
                is_setup_ready=false
                for setup_attempt in {1..10}; do
                  if "$assertion" "$name" "screenshots/$name.png"; then
                    is_setup_ready=true
                    break
                  fi
                  cp "screenshots/$name.png" "screenshots/$name-attempt-$setup_attempt.png"
                  sleep 3
                  xcrun simctl io "$device" screenshot "screenshots/$name.png"
                done
                if [ "$is_setup_ready" != true ]; then
                  xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process == "TeaNode"' || true
                  exit 1
                fi
                ;;
            esac
          }
          shoot connect-light light large
          shoot connect-dark dark large
          shoot connect-largest-text light accessibility-extra-extra-extra-large
          shoot conversation-light light large -TeaNodeDemo
          if [ -f screenshots/conversation-light.png ] && build/assert-recording-screenshot recordings-light screenshots/conversation-light.png; then
            echo "Recording content assertion accepted the conversation screen."
            exit 1
          fi
          if [ -f screenshots/conversation-light.png ] && build/assert-device-setup-screenshot device-setup-light screenshots/conversation-light.png; then
            echo "Device setup assertion accepted the conversation screen."
            exit 1
          fi
          shoot conversation-dark dark large -TeaNodeDemo
          shoot conversation-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo
          shoot conversation-long-message-light light large -TeaNodeDemo -TeaNodeScreen conversation-long-message
          shoot conversation-long-message-dark dark large -TeaNodeDemo -TeaNodeScreen conversation-long-message
          shoot conversation-long-message-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeScreen conversation-long-message
          shoot conversation-long-message-read-light light large -TeaNodeDemo -TeaNodeScreen conversation-long-message-read
          shoot mail-light light large -TeaNodeDemo -TeaNodeTab mail
          shoot mail-dark dark large -TeaNodeDemo -TeaNodeTab mail
          shoot calendar-light light large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-dark dark large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-chinese-light light large -TeaNodeDemo -TeaNodeTab calendar -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN
          shoot calendar-day-light light large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen calendar-day
          shoot calendar-day-dark dark large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen calendar-day
          shoot location-light light large -TeaNodeDemo -TeaNodeTab location
          shoot location-dark dark large -TeaNodeDemo -TeaNodeTab location
          shoot location-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab location
          shoot location-day-light light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-day
          shoot location-day-dark dark large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-day
          shoot location-places-light light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-places
          shoot location-places-dark dark large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-places
          shoot location-place-light light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-place
          shoot location-place-dark dark large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-place
          shoot location-place-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-place
          shoot location-address-light light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-address
          shoot location-address-dark dark large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-address
          shoot location-settings-light light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen location-settings
          # Sharing, a person chosen on the map, many people sharing, the check-in sheet, and setting Location up.
          for location_screen in location-sharing location-person location-people location-checkin location-setup; do
            shoot "$location_screen-light" light large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen "$location_screen"
            shoot "$location_screen-dark" dark large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen "$location_screen"
            shoot "$location_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab location -TeaNodeScreen "$location_screen"
          done
          shoot recordings-light light large -TeaNodeDemo -TeaNodeTab recordings
          shoot recordings-dark dark large -TeaNodeDemo -TeaNodeTab recordings
          shoot recordings-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab recordings
          for recording_screen in recording-compatible-playback recording-original-playback recording-original-preview recording-attachment-import recording-source-settings recording-citation recording-learning-stopped recording-detail recording-unnamed recording-capture recording-capture-live recording-transcript recording-version recording-speakers recording-text-history recording-text-editor recording-model-settings recording-quota-settings; do
            shoot "$recording_screen-light" light large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
            shoot "$recording_screen-dark" dark large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
            shoot "$recording_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
          done
          shoot coding-light light large -TeaNodeDemo -TeaNodeTab coding -TeaNodeScreen coding
          shoot coding-session-light light large -TeaNodeDemo -TeaNodeTab coding -TeaNodeScreen coding-session
          shoot coding-session-dark dark large -TeaNodeDemo -TeaNodeTab coding -TeaNodeScreen coding-session
          shoot coding-session-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab coding -TeaNodeScreen coding-session
          shoot contacts-light light large -TeaNodeDemo -TeaNodeTab contacts
          shoot contacts-dark dark large -TeaNodeDemo -TeaNodeTab contacts
          shoot menu-dark dark large -TeaNodeDemo -TeaNodeMenu
          shoot menu-light light large -TeaNodeDemo -TeaNodeMenu
          shoot knowledge-dark dark large -TeaNodeDemo -TeaNodeTab knowledge
          # A page with the person's own records linked to it, asserted by what it shows.
          shoot knowledge-records-light light large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          shoot knowledge-records-dark dark large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          shoot knowledge-linked-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          # The same page scrolled to the recording's row, with its passage count.
          shoot knowledge-records-recording-light light large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot knowledge-records-recording-dark dark large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot knowledge-records-recording-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot finance-light light large -TeaNodeDemo -TeaNodeTab finance
          shoot finance-menu-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeMenu
          # The finance charts: the donut and its rows, a touched month, slice
          # and day, and the net worth line.
          shoot finance-dark dark large -TeaNodeDemo -TeaNodeTab finance
          shoot cash-flow-chosen-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen cash-flow-chosen
          shoot spending-day-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-day
          shoot spending-day-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-day
          shoot spending-year-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-year
          shoot spending-year-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-year
          shoot spending-year-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-year
          shoot spending-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-groups
          shoot spending-chosen-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-chosen
          shoot spending-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-groups
          shoot net-worth-chosen-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen net-worth-chosen
          shoot net-worth-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen net-worth
          shoot mail-menu-dark dark large -TeaNodeDemo -TeaNodeTab mail -TeaNodeMenu
          shoot ideas-light light large -TeaNodeDemo -TeaNodeTab ideas
          shoot goals-light light large -TeaNodeDemo -TeaNodeTab goals
          # The side menu on Photos: the collections and the photo backup under the parts.
          shoot photos-menu-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeMenu
          shoot photos-menu-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeMenu
          # Photos, from invented photos drawn by the demo server: the library as a grid, the viewer on its
          # first photo, the Trash, and a library with nothing in it.
          shoot photos-library-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library
          shoot photos-library-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library
          shoot photos-library-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library
          shoot photos-viewer-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer
          shoot photos-viewer-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer
          shoot photos-viewer-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer
          # The viewer as the Photos app lays it out: Info over it, and after a tap with the bars and the strip gone.
          shoot photos-viewer-info-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-info
          shoot photos-viewer-info-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-info
          shoot photos-viewer-hidden-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-hidden
          # A video in the viewer, stopped a third of the way in so that its controls are on screen.
          shoot photos-video-viewer-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-video-viewer
          shoot photos-video-viewer-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-video-viewer
          # The library under Months and Years (Library, All is photos-library above).
          shoot photos-library-months-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library-months
          shoot photos-library-months-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library-months
          shoot photos-library-years-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library-years
          shoot photos-library-years-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-library-years
          shoot photos-trash-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-trash
          shoot photos-trash-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-trash
          shoot photos-trash-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-trash
          shoot photos-empty-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-empty
          # Albums: the Albums section with a suggestion, one album, and Select mode with two photos chosen.
          shoot photos-albums-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-albums
          shoot photos-albums-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-albums
          shoot photos-albums-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-albums
          shoot photos-album-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-album
          shoot photos-album-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-album
          shoot photos-select-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-select
          shoot photos-select-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-select
          # Search over the library, Select mode in the Trash, and Info over a photo that could not be made ready.
          shoot photos-search-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-search
          shoot photos-search-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-search
          shoot photos-trash-select-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-trash-select
          shoot photos-trash-select-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-trash-select
          shoot photos-viewer-failed-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-failed
          shoot photos-viewer-failed-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-failed
          shoot photos-viewer-failed-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-failed
          # Descriptions and people: Info over the viewer with a description and the people in the photo, the
          # People section, one person, and the switch for finding faces.
          shoot photos-viewer-described-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-described
          shoot photos-viewer-described-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-viewer-described
          shoot photos-people-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-people
          shoot photos-people-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-people
          shoot photos-people-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-people
          shoot photos-person-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-person
          shoot photos-person-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-person
          shoot photos-faces-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-faces
          shoot photos-faces-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen photos-faces
          # Shared albums: Albums with the person's own, those shared with them and a circle's; the share
          # sheet over an album; an album another person shared, and the viewer over its first photo (no
          # favorite or Trash, Save to my library instead).
          shoot photos-shared-albums-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-albums
          shoot photos-shared-albums-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-albums
          shoot photos-shared-albums-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-albums
          shoot photos-share-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-share
          shoot photos-share-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-share
          shoot photos-share-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-share
          shoot photos-shared-album-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-album
          shoot photos-shared-viewer-light light large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-viewer
          shoot photos-shared-viewer-dark dark large -TeaNodeDemo -TeaNodeTab photos -TeaNodeScreen photos-shared-viewer
          # Info over a photo another person shared: no file name, no place, the people by name and no Describe;
          # the question before a share is stopped, pointing at the share's menu; the title asked for an album
