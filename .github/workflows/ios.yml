name: iOS

# The iPhone app (ios/). Nobody working on it needs a Mac: the package's
# tests run on Linux, and the app is built on GitHub's macOS runners, which
# are free for a public repository.
on:
  # Every pull request, so the checks are there to be required; one that
  # does not touch the app skips the build at once (see changes). By hand,
  # on any branch, for a build that also goes to TestFlight.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Whether a pull request touches the app. A required check that never
  # reports holds a pull request forever, so the workflow runs on every one
  # and the builds are skipped, which counts as passing, when nothing in
  # ios/ changed.
  changes:
    name: App changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(ios/|\.github/workflows/ios\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  kit:
    name: TeaNodeKit on Linux
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test
        working-directory: ios/TeaNodeKit
        run: swift test

  app:
    name: App on macOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Say which Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Test TeaNodeKit
        working-directory: ios/TeaNodeKit
        run: swift test

      - name: Generate the project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      # A simulator build needs no signing, so it needs none of the
      # developer account's secrets either.
      - name: Build for the simulator
        working-directory: ios
        run: >
          xcodebuild build
          -project TeaNode.xcodeproj
          -scheme TeaNode
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          -quiet

      # What the screens look like, for the review ios/DESIGN.md asks for:
      # the connect screen, and a conversation of invented data from the
      # debug build's demo server, in light, dark and the largest text size.
      - name: Take screenshots
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphonesimulator/TeaNode.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime in sorted(runtimes) if "iOS" in runtime for device in runtimes[runtime]
                    if device["name"].startswith("iPhone") and device["name"].endswith("Pro")]
          print(phones[-1]["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          mkdir -p screenshots
          swiftc scripts/assert-recording-screenshot.swift -o build/assert-recording-screenshot
          swiftc scripts/assert-device-setup-screenshot.swift -o build/assert-device-setup-screenshot
          swiftc scripts/assert-knowledge-screenshot.swift -o build/assert-knowledge-screenshot
          shoot() {
            name=$1 appearance=$2 size=$3
            shift 3
            xcrun simctl ui "$device" appearance "$appearance"
            xcrun simctl ui "$device" content_size "$size"
            xcrun simctl terminate "$device" "$bundle" 2>/dev/null || true
            xcrun simctl launch "$device" "$bundle" "$@"
            sleep 8
            xcrun simctl io "$device" screenshot "screenshots/$name.png"
            case "$name" in
              recordings-*|recording-*|device-setup-*|knowledge-records-*)
                # The screen may still be loading its demo answers: look
                # again a few times before calling it wrong.
                case "$name" in
                  device-setup-*) assertion=build/assert-device-setup-screenshot ;;
                  knowledge-records-*) assertion=build/assert-knowledge-screenshot ;;
                  *) assertion=build/assert-recording-screenshot ;;
                esac
                is_setup_ready=false
                for setup_attempt in {1..10}; do
                  if "$assertion" "$name" "screenshots/$name.png"; then
                    is_setup_ready=true
                    break
                  fi
                  cp "screenshots/$name.png" "screenshots/$name-attempt-$setup_attempt.png"
                  sleep 3
                  xcrun simctl io "$device" screenshot "screenshots/$name.png"
                done
                if [ "$is_setup_ready" != true ]; then
                  xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process == "TeaNode"' || true
                  exit 1
                fi
                ;;
            esac
          }
          shoot connect-light light large
          shoot connect-dark dark large
          shoot connect-largest-text light accessibility-extra-extra-extra-large
          shoot conversation-light light large -TeaNodeDemo
          if build/assert-recording-screenshot recordings-light screenshots/conversation-light.png; then
            echo "Recording content assertion accepted the conversation screen."
            exit 1
          fi
          if build/assert-device-setup-screenshot device-setup-light screenshots/conversation-light.png; then
            echo "Device setup assertion accepted the conversation screen."
            exit 1
          fi
          shoot conversation-dark dark large -TeaNodeDemo
          shoot conversation-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo
          shoot mail-light light large -TeaNodeDemo -TeaNodeTab mail
          shoot mail-dark dark large -TeaNodeDemo -TeaNodeTab mail
          shoot calendar-light light large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-dark dark large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab calendar
          shoot calendar-chinese-light light large -TeaNodeDemo -TeaNodeTab calendar -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN
          shoot calendar-day-light light large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen calendar-day
          shoot calendar-day-dark dark large -TeaNodeDemo -TeaNodeTab calendar -TeaNodeScreen calendar-day
          shoot recordings-light light large -TeaNodeDemo -TeaNodeTab recordings
          shoot recordings-dark dark large -TeaNodeDemo -TeaNodeTab recordings
          shoot recordings-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab recordings
          for recording_screen in recording-compatible-playback recording-original-playback recording-original-preview recording-attachment-import recording-source-settings recording-citation recording-learning-stopped recording-detail recording-unnamed recording-capture recording-capture-live recording-transcript recording-version recording-speakers recording-text-history recording-text-editor recording-model-settings recording-quota-settings; do
            shoot "$recording_screen-light" light large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
            shoot "$recording_screen-dark" dark large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
            shoot "$recording_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab recordings -TeaNodeScreen "$recording_screen"
          done
          shoot contacts-light light large -TeaNodeDemo -TeaNodeTab contacts
          shoot contacts-dark dark large -TeaNodeDemo -TeaNodeTab contacts
          shoot menu-dark dark large -TeaNodeDemo -TeaNodeMenu
          shoot menu-light light large -TeaNodeDemo -TeaNodeMenu
          shoot knowledge-dark dark large -TeaNodeDemo -TeaNodeTab knowledge
          # A page with the person's own records linked to it, asserted by what it shows.
          shoot knowledge-records-light light large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          shoot knowledge-records-dark dark large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          shoot knowledge-linked-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records
          # The same page scrolled to the recording's row, with its passage count.
          shoot knowledge-records-recording-light light large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot knowledge-records-recording-dark dark large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot knowledge-records-recording-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab knowledge -TeaNodeScreen knowledge-records-recording
          shoot finance-light light large -TeaNodeDemo -TeaNodeTab finance
          shoot finance-menu-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeMenu
          # The finance charts: the donut and its rows, a touched month, slice
          # and day, and the net worth line.
          shoot finance-dark dark large -TeaNodeDemo -TeaNodeTab finance
          shoot cash-flow-chosen-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen cash-flow-chosen
          shoot spending-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-groups
          shoot spending-chosen-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-chosen
          shoot spending-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen spending-groups
          shoot net-worth-chosen-light light large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen net-worth-chosen
          shoot net-worth-dark dark large -TeaNodeDemo -TeaNodeTab finance -TeaNodeScreen net-worth
          shoot mail-menu-dark dark large -TeaNodeDemo -TeaNodeTab mail -TeaNodeMenu
          shoot ideas-light light large -TeaNodeDemo -TeaNodeTab ideas
          shoot goals-light light large -TeaNodeDemo -TeaNodeTab goals
          # Settings, and the screens it pushes, named by -TeaNodeScreen.
          shoot settings-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings
          shoot settings-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings
          # A confirmation points at the button that asked for it.
          shoot settings-sign-out-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings-sign-out
          shoot settings-sign-out-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen settings-sign-out
          for setup_screen in device-setup device-setup-mail device-setup-collections device-setup-profile device-setup-unavailable device-setup-expired device-setup-receipt-unavailable; do
            shoot "$setup_screen-light" light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
            shoot "$setup_screen-dark" dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
            shoot "$setup_screen-largest-text" light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen "$setup_screen"
          done
          shoot agent-settings-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen agent-settings
          shoot manage-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen manage
          shoot people-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen people
          shoot domain-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen domain
          shoot domain-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen domain
          shoot dns-records-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dns-records
          # The provider editor, scrolled to the price of a particular model.
          shoot provider-prices-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          shoot provider-prices-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          shoot provider-prices-largest-text light accessibility-extra-extra-extra-large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen provider-prices
          shoot dns-records-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dns-records
          shoot server-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen server
          shoot sessions-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen sessions
          shoot devices-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen devices
          shoot devices-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen devices
          shoot phones-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen phones
          shoot rules-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen rules
          shoot dreams-dark dark large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen dreams
          shoot schedules-light light large -TeaNodeDemo -TeaNodeTab settings -TeaNodeScreen schedules

          # The App Store's set: the largest iPhone, which its listing needs,
          # with the status bar Apple's own screenshots show.
          xcrun simctl shutdown "$device"
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime in sorted(runtimes) if "iOS" in runtime for device in runtimes[runtime]
                    if device["name"].startswith("iPhone") and device["name"].endswith("Pro Max")]
          print(phones[-1]["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 --operatorName ""
          mkdir -p screenshots/store
          shoot store/1-conversation light large -TeaNodeDemo
          shoot store/2-mail light large -TeaNodeDemo -TeaNodeTab mail
          shoot store/3-calendar light large -TeaNodeDemo -TeaNodeTab calendar
          shoot store/4-goals light large -TeaNodeDemo -TeaNodeTab goals
          shoot store/5-menu dark large -TeaNodeDemo -TeaNodeMenu
          shoot store/6-conversation-dark dark large -TeaNodeDemo

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ios/screenshots

  # Signs the app and uploads it to App Store Connect, where it appears in
  # TestFlight once Apple has processed it (usually 10 to 30 minutes).
  # Signing is automatic: the development certificate kept in the secrets
  # signs the archive, and the App Store Connect key, with the Admin role,
  # lets Xcode fetch the profiles and the distribution certificate it
  # needs. Only a push to main or to an ios/... branch uploads, never a
  # pull request.
  testflight:
    name: TestFlight
    if: github.event_name != 'pull_request'
    needs: [kit, app]
    runs-on: macos-latest
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The project is generated, with what Homebrew installs, before the
      # App Store Connect key is on disk: nothing installed reads it.
      - name: Generate the project
        working-directory: ios
        run: |
          printf 'DEVELOPMENT_TEAM = %s\n' "$TEAM" > Configuration/Identity.xcconfig
          brew install xcodegen
          xcodegen generate

      - name: Put the App Store Connect key where Xcode reads it
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      # Archiving signs with a development certificate. One is kept in the
      # secrets and put in a keychain of the run's own; without it Xcode
      # would make a new certificate every run, and Apple allows only a few.
      - name: Put the signing certificate in a keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/keys/development.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/keys/development.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/keys/development.p12"

      # The build number is the workflow's run number, which only grows, as
      # App Store Connect requires of builds of one version.
      - name: Archive
        working-directory: ios
        run: >
          xcodebuild archive
          -project TeaNode.xcodeproj
          -scheme TeaNode
          -destination 'generic/platform=iOS'
          -archivePath build/TeaNode.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          -quiet

      - name: Sign and upload to App Store Connect
        working-directory: ios
        run: >
          xcodebuild -exportArchive
          -archivePath build/TeaNode.xcarchive
          -exportOptionsPlist Configuration/ExportOptions.plist
          -exportPath build/export
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          -authenticationKeyID "$KEY_ID"
          -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys" ios/Configuration/Identity.xcconfig
