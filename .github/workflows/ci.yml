name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      # The database tests take their connection from this. Without it they
      # skip rather than fail, which would quietly hollow out CI.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teanode
          POSTGRES_USER: teanode
          POSTGRES_PASSWORD: teanode
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false # dependencies are vendored

      - name: Check formatting
        run: make check

      - name: Vet
        run: go vet -mod=vendor . ./cmd/... ./internal/...

      - name: Build
        run: make build

      # mulint is deliberately absent: it is a local-only check, so a
      # contributor without it installed is never blocked. See mulint.yaml.
      - name: Lint
        run: make lint-ci

      - name: Test
        env:
          TEANODE_TEST_DATABASE_HOST: 127.0.0.1
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --format testname -- -mod=vendor -race -cover \
            -coverprofile=coverage.out . ./cmd/... ./internal/...
          go tool cover -func=coverage.out | tail -1

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Building the image on every change catches the two ways it silently
      # breaks: the dashboard stage failing, and .dockerignore excluding
      # something the build needs.
      - name: Build
        run: docker build -f deploy/Dockerfile -t teanode:ci .

      - name: Check it runs
        run: docker run --rm teanode:ci version
