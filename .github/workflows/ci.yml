name: CI

on:
  push:
    branches: [main]
  pull_request:

# On a branch, a new push makes the run before it pointless, so it is
# cancelled. On main it is the opposite: every commit there is a thing
# somebody may check out or bisect, and the release bot pushes its
# "chore(release):" commit seconds after each merge, which cancelled the
# merge's own run every time. Main had not had a completed CI run since the
# first commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      # The database tests take their connection from this. Without it they
      # skip rather than fail, which would quietly hollow out CI.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: teanode
          POSTGRES_USER: teanode
          POSTGRES_PASSWORD: teanode
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # From go.mod, so the version CI builds with is the version the
          # module declares: they drifted, go.mod went to 1.26 with a
          # dependency, and the pin here stayed at 1.25.
          go-version-file: go.mod
          # The module cache is useless here -- the dependencies are vendored
          # -- and the build cache is kept below, where the key says what it
          # actually depends on.
          cache: false

      # What the compiler already did, kept. Every run used to rebuild the
      # whole dependency graph twice -- once plainly and once instrumented
      # for the race detector -- before a single test ran. The key changes
      # with go.mod, which is where the Go version and the dependencies are
      # declared, and with the Makefile, which is where the versions of the
      # tools it installs are; the restore keys mean a commit that changes
      # none of those starts from the last run's work and recompiles only
      # what it touched.
      #
      # ~/go/bin is in it for the two tools the Makefile installs on demand,
      # golangci-lint and gotestsum, which were downloaded and built again on
      # every run. The Makefile checks the version it finds there, so a
      # pinned version that moves is installed again rather than shadowed by
      # whatever an older cache held.
      - name: Cache what has already been compiled
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/bin
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'vendor/modules.txt', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod', 'vendor/modules.txt', 'Makefile') }}-
            go-${{ runner.os }}-

      - name: Check formatting
        run: make check

      - name: Build
        run: make build

      # The naming checks are deliberately absent: they are a local-only
      # check, so a contributor without them installed is never blocked.
      - name: Lint
        run: make lint-ci

      # -race stays: this server is goroutines around a mail stream, and the
      # race detector has earned its place. Coverage does not — it was
      # measured and printed and nothing was ever decided on it.
      #
      # -timeout is above Go's ten-minute default because two packages have
      # grown past it on this hardware: every authenticated request in them
      # costs a bcrypt at the cost a real password is stored under, and the
      # race detector makes each one slower again. Raising the bound is the
      # honest answer — the tests are not hanging, there are simply a lot of
      # them, and a bound that fires on a healthy suite teaches people to
      # rerun CI rather than to read it.
      # -count=1 turns off the result cache while keeping the build cache
      # above: what was compiled is reused, what was asserted is asserted
      # again. A suite that reports "(cached)" for a package nobody touched
      # is right almost always, and the exception -- a test that passes
      # intermittently -- is exactly the one worth running.
      - name: Test
        env:
          TEANODE_TEST_DATABASE_HOST: 127.0.0.1
          TEANODE_TEST_VECTOR: "off"
        run: go test -mod=vendor -race -count=1 -timeout 25m ./cmd/... ./internal/...

  vector:
    name: Vector database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: teanode
          POSTGRES_USER: teanode
          POSTGRES_PASSWORD: teanode
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test vector persistence and knowledge processing
        env:
          TEANODE_TEST_DATABASE_HOST: 127.0.0.1
          TEANODE_TEST_VECTOR: "on"
        run: go test -mod=vendor -race -count=1 -timeout 25m ./internal/db ./internal/agent

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      # No build step: the image job builds this same dashboard through
      # deploy/Dockerfile, so building it here too only spent the time twice.
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test behavior
        working-directory: web
        run: npm test

  image:
    name: Container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Building the image on every change catches the two ways it silently
      # breaks: the dashboard stage failing, and .dockerignore excluding
      # something the build needs.
      - name: Build
        run: docker build -f deploy/Dockerfile -t teanode:ci .

      - name: Check both programs run
        run: |
          docker run --rm teanode:ci version
          docker run --rm --entrypoint teanode teanode:ci version
